[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcycle"
version = "0.2.0"
description = "A local end-to-end model lifecycle for a churn model: validation, training, packaging, a file registry with promotion gates, a FastAPI scoring service, drift monitoring and a comparison of retraining policies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3",
                "fastapi>=0.110", "pydantic>=2.5"]

[project.optional-dependencies]
serve = ["uvicorn>=0.27"]
tracking = ["mlflow>=2.10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mlcycle = "mlcycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
